# Example Lovelace dashboard for HAWahooligan.
#
# Three views, each one a focused slice of the integration's data:
#
#   1. Route    — picker-driven deep-dive into one ride: map, workout
#                 metadata, time/distance, power/body.
#   2. Lifetime — accumulated totals + indoor/outdoor split + a quick
#                 trailing-window block (7d/28d) for "recent activity".
#   3. Profile  — FTP, critical power, the seven power-zone boundaries.
#                 Editing from the dashboard is read-only for now —
#                 placeholder card points at the Companion App / Postman.
#                 Tracked in tasks/todo.md (Quick Win #5, set_power_zones
#                 service).
#
# Entity IDs follow what HA actually registers, which is the slugified
# English translation NAME — not the translation_key. So
# ``translation_key: speed_avg`` + ``name: "Average speed"`` becomes
# ``sensor.hawahooligan_average_speed`` (NOT ``..._speed_avg``).
# If your entity registry shows different ids — e.g. because you carried
# an entity over from an earlier version of the integration — adjust the
# entries below or rename the entities in the HA Settings → Entities UI.
#
# Layout note: every view uses the modern `sections` type. In a sections
# grid the iframe card's `aspect_ratio` is ignored (HA frontend treats
# grid placement as authoritative — see hui-iframe-card.ts), so the map
# needs an explicit ``grid_options.rows`` to get height. Each row is
# ~56px; ``rows: 9`` is a comfortable starting point — increase for a
# bigger map.

views:
  # ──────────────────────────────────────────────────────────────────
  # View 1 — Route. Picker-driven deep-dive into the chosen ride.
  # ──────────────────────────────────────────────────────────────────
  - title: Route
    path: route
    icon: mdi:map-marker-path
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Map
            heading_style: title
            icon: mdi:map-marker-path
          # The picker is a SelectEntity now — drives the headline sensors
          # AND the iframe below via ``workouts.json``. Pick any ride
          # (indoor / manual / outdoor); if the chosen one has no track the
          # iframe shows a friendly overlay instead of an empty map.
          - type: entities
            entities:
              - entity: select.hawahooligan_workout_picker
                name: Workout
            state_color: false
            grid_options:
              columns: 12
              rows: auto
          - type: iframe
            url: /local/hawahooligan/map.html
            # In sections view aspect_ratio is ignored — size via grid_options.
            grid_options:
              columns: 12
              rows: 9
            # ``?id=<workout_id>`` deep-links a single workout and overrides
            # the picker selection until the page reloads:
            # url: /local/hawahooligan/map.html?id=123456

      - type: grid
        cards:
          - type: heading
            heading: Workout
            heading_style: title
            icon: mdi:bike
          - type: entities
            entities:
              - entity: sensor.hawahooligan_last_workout
                name: Start
                secondary_info: last-changed
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: name
                name: Name
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: workout_type
                name: Type
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: indoor
                name: Indoor
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: route_id
                name: Route ID
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: plan_id
                name: Plan ID
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: selected_workout_id
                name: Selection
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Time & distance
            heading_style: title
            icon: mdi:clock-outline
          - type: entities
            entities:
              - entity: sensor.hawahooligan_duration
              - entity: sensor.hawahooligan_total_duration
              - entity: sensor.hawahooligan_paused_duration
              - entity: sensor.hawahooligan_distance
              - entity: sensor.hawahooligan_ascent
              - entity: sensor.hawahooligan_average_speed
              - entity: sensor.hawahooligan_calories
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Power & body
            heading_style: title
            icon: mdi:flash
          - type: entities
            entities:
              - entity: sensor.hawahooligan_average_power
              - entity: sensor.hawahooligan_normalized_power
              - entity: sensor.hawahooligan_training_stress_score
              - entity: sensor.hawahooligan_work
              - entity: sensor.hawahooligan_average_heart_rate
              - entity: sensor.hawahooligan_average_cadence
            state_color: false
            grid_options:
              columns: 12
              rows: auto

  # ──────────────────────────────────────────────────────────────────
  # View 2 — Lifetime. Totals + indoor/outdoor + trailing windows.
  # ──────────────────────────────────────────────────────────────────
  - title: Lifetime
    path: lifetime
    icon: mdi:counter
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Lifetime totals
            heading_style: title
            icon: mdi:counter
          # Lifetime sensors carry state_class=total_increasing — drop a
          # utility_meter helper on top of any of them via the YAML block
          # in the project README to get daily/weekly/monthly/yearly buckets.
          - type: entities
            entities:
              - entity: sensor.hawahooligan_lifetime_workouts
              - entity: sensor.hawahooligan_lifetime_distance
              - entity: sensor.hawahooligan_lifetime_ascent
              - entity: sensor.hawahooligan_lifetime_duration
              - entity: sensor.hawahooligan_lifetime_calories
              - entity: sensor.hawahooligan_lifetime_work
              - entity: sensor.hawahooligan_lifetime_tss
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Recent activity
            heading_style: title
            icon: mdi:chart-timeline-variant-shimmer
          # Trailing-window sensors shipped 0.7.20. The 7d row is "the
          # last 7 days ending now" (rolling), NOT "this Mon-to-Sun"
          # (calendar). For calendar buckets see the utility_meter block
          # in the project README.
          - type: entities
            entities:
              - entity: sensor.hawahooligan_rolling_workouts_7d
              - entity: sensor.hawahooligan_rolling_distance_7d
              - entity: sensor.hawahooligan_rolling_duration_7d
              - entity: sensor.hawahooligan_rolling_tss_7d
              - entity: sensor.hawahooligan_rolling_workouts_28d
              - entity: sensor.hawahooligan_rolling_distance_28d
              - entity: sensor.hawahooligan_rolling_duration_28d
              - entity: sensor.hawahooligan_rolling_tss_28d
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Outdoor vs indoor
            heading_style: subtitle
            icon: mdi:weather-sunny
          # Every lifetime sensor carries ``outdoor`` and ``indoor`` sub-sums
          # as attributes. The markdown table below renders them in one
          # compact view; for a single-metric template sensor use
          # state_attr('sensor.hawahooligan_lifetime_distance', 'outdoor').
          # Workouts persisted before 0.7.2 had no location flag and
          # therefore land in neither subset — only the headline totals
          # claim them.
          # Row labels read the entity's friendly name via
          # ``state_attr(..., 'friendly_name')`` so the table picks up the
          # user's HA locale automatically — a German install sees
          # "Distanz insgesamt" while an English install sees "Lifetime
          # distance". The ``or '<fallback>'`` clause guards against the
          # early-startup race where the integration is still loading and
          # the entity doesn't exist yet — the older ``states.sensor.X.name``
          # form crashed the template renderer with ``UndefinedError: 'None'
          # has no attribute 'name'`` in exactly that window.
          # The English fallback labels are used both as the default copy and
          # as the safety net when the locale-aware lookup misses.
          - type: markdown
            content: >
              | | Outdoor | Indoor |

              |---|---|---|

              | {{ state_attr('sensor.hawahooligan_lifetime_workouts', 'friendly_name') or 'Lifetime workouts' }} | {{ state_attr('sensor.hawahooligan_lifetime_workouts','outdoor') or 0 }} | {{ state_attr('sensor.hawahooligan_lifetime_workouts','indoor') or 0 }} |

              | {{ state_attr('sensor.hawahooligan_lifetime_distance', 'friendly_name') or 'Lifetime distance' }} | {{ (state_attr('sensor.hawahooligan_lifetime_distance','outdoor') or 0) | round(1) }} km | {{ (state_attr('sensor.hawahooligan_lifetime_distance','indoor') or 0) | round(1) }} km |

              | {{ state_attr('sensor.hawahooligan_lifetime_ascent', 'friendly_name') or 'Lifetime ascent' }} | {{ (state_attr('sensor.hawahooligan_lifetime_ascent','outdoor') or 0) | round(0) }} m | {{ (state_attr('sensor.hawahooligan_lifetime_ascent','indoor') or 0) | round(0) }} m |

              | {{ state_attr('sensor.hawahooligan_lifetime_duration', 'friendly_name') or 'Lifetime duration' }} | {{ (state_attr('sensor.hawahooligan_lifetime_duration','outdoor') or 0) | round(0) }} min | {{ (state_attr('sensor.hawahooligan_lifetime_duration','indoor') or 0) | round(0) }} min |

              | {{ state_attr('sensor.hawahooligan_lifetime_calories', 'friendly_name') or 'Lifetime calories' }} | {{ (state_attr('sensor.hawahooligan_lifetime_calories','outdoor') or 0) | round(0) }} kcal | {{ (state_attr('sensor.hawahooligan_lifetime_calories','indoor') or 0) | round(0) }} kcal |

              | {{ state_attr('sensor.hawahooligan_lifetime_work', 'friendly_name') or 'Lifetime work' }} | {{ (state_attr('sensor.hawahooligan_lifetime_work','outdoor') or 0) | round(0) }} kJ | {{ (state_attr('sensor.hawahooligan_lifetime_work','indoor') or 0) | round(0) }} kJ |

              | {{ state_attr('sensor.hawahooligan_lifetime_tss', 'friendly_name') or 'Lifetime TSS' }} | {{ (state_attr('sensor.hawahooligan_lifetime_tss','outdoor') or 0) | round(0) }} | {{ (state_attr('sensor.hawahooligan_lifetime_tss','indoor') or 0) | round(0) }} |
            grid_options:
              columns: 12
              rows: auto

  # ──────────────────────────────────────────────────────────────────
  # View 3 — Profile. FTP, Critical Power, the seven zone boundaries.
  # ──────────────────────────────────────────────────────────────────
  - title: Profile
    path: profile
    icon: mdi:account-heart-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Headline metrics
            heading_style: title
            icon: mdi:flash
          # Power-zones data refreshes once a day (or on demand via the
          # ``hawahooligan.refresh_power_zones`` service). The seven zone
          # boundaries ride along as attributes on sensor.hawahooligan_ftp.
          - type: entities
            entities:
              - entity: sensor.hawahooligan_ftp
              - entity: sensor.hawahooligan_critical_power
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Power zones (Biking)
            heading_style: title
            icon: mdi:chart-bell-curve
          # Reads the seven zone-boundary attributes off the FTP sensor.
          # Wahoo returns absolute watts per zone — these are the UPPER
          # boundary of each zone (so Zone 1 is "everything below zone_1
          # watts", Zone 7 is "everything above zone_6 watts up to zone_7").
          # The first/last labels use < and > accordingly.
          - type: markdown
            content: >
              | Zone | Range |

              |---|---|

              | Z1 (Recovery) | < {{ state_attr('sensor.hawahooligan_ftp', 'zone_1') or '—' }} W |

              | Z2 (Endurance) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_1') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_2') or '—' }} W |

              | Z3 (Tempo) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_2') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_3') or '—' }} W |

              | Z4 (Threshold) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_3') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_4') or '—' }} W |

              | Z5 (VO2max) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_4') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_5') or '—' }} W |

              | Z6 (Anaerobic) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_5') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_6') or '—' }} W |

              | Z7 (Neuromuscular) | > {{ state_attr('sensor.hawahooligan_ftp', 'zone_6') or '—' }} W |
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Edit zones
            heading_style: subtitle
            icon: mdi:pencil-outline
          # Editing FTP / zones from within HA is on the roadmap — see
          # tasks/todo.md Quick Win #5 (``set_power_zones`` service +
          # ``power_zones_write`` scope migration). Until then:
          - type: markdown
            content: >
              **Editing FTP and zone thresholds from HA is not yet supported.**
              The integration is currently read-only for power zones; a
              ``hawahooligan.set_power_zones`` service is on the roadmap.


              Today, change your zones via:


              - the **Wahoo Companion App** (Profile → Settings → Power Zones).
              The cloud-API sync is sometimes flaky — manually trigger
              ``hawahooligan.refresh_power_zones`` from Developer Tools →
              Services after editing.

              - the **Wahoo Cloud API directly** via Postman. See the
              `power_zones` folder in
              [`docs/wahoo-cloud-api.postman_collection.json`](https://github.com/mrebbert/hawahooligan/blob/main/docs/wahoo-cloud-api.postman_collection.json)
              for ready-made POST / PUT requests. Heads-up: records are
              app-scoped — Postman MUST use the same client_id as HA's
              Application Credentials, otherwise the new record stays
              invisible to HA.
            grid_options:
              columns: 12
              rows: auto

# ──────────────────────────────────────────────────────────────────
# Future views (NOT shipped — see tasks/todo.md "Publication plan"):
#
# - Routes — list every route synced from komoot / Wahoo, filterable.
#   BLOCKED: Wahoo Cloud API only sees routes uploaded via /v1/routes;
#   Komoot-sync routes bypass the API. See "Plans → Calendar entity"
#   LOW VALUE block in tasks/todo.md.
#
# - Workouts — paginated browser of every past workout from the
#   manifest + detail cache. Useful for "find that one ride from
#   August" type queries.
# ──────────────────────────────────────────────────────────────────
