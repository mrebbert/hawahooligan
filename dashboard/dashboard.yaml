views:
  - title: Route
    path: route
    icon: mdi:map-marker-path
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Map
            heading_style: title
            icon: mdi:map-marker-path
          - type: entities
            entities:
              - entity: select.hawahooligan_workout_picker
                name: Workout
            state_color: false
            grid_options:
              columns: 12
              rows: auto
          - type: iframe
            url: /local/hawahooligan/map.html
            grid_options:
              columns: 12
              rows: 9
      - type: grid
        cards:
          - type: heading
            heading: Workout
            heading_style: title
            icon: mdi:bike
          - type: entities
            entities:
              - entity: sensor.hawahooligan_last_workout
                name: Start
                secondary_info: last-changed
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: name
                name: Name
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: workout_type
                name: Type
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: indoor
                name: Indoor
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: route_id
                name: Route ID
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: plan_id
                name: Plan ID
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: selected_workout_id
                name: Selection
            state_color: false
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Time & distance
            heading_style: title
            icon: mdi:clock-outline
          - type: entities
            entities:
              - entity: sensor.hawahooligan_duration
              - entity: sensor.hawahooligan_total_duration
              - entity: sensor.hawahooligan_paused_duration
              - entity: sensor.hawahooligan_distance
              - entity: sensor.hawahooligan_ascent
              - entity: sensor.hawahooligan_average_speed
              - entity: sensor.hawahooligan_calories
            state_color: false
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Power & body
            heading_style: title
            icon: mdi:flash
          - type: entities
            entities:
              - entity: sensor.hawahooligan_average_power
              - entity: sensor.hawahooligan_normalized_power
              - entity: sensor.hawahooligan_training_stress_score
              - entity: sensor.hawahooligan_work
              - entity: sensor.hawahooligan_average_heart_rate
              - entity: sensor.hawahooligan_average_cadence
            state_color: false
            grid_options:
              columns: 12
              rows: auto

  - title: Lifetime
    path: lifetime
    icon: mdi:counter
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: At a glance
            heading_style: title
            icon: mdi:chart-line
          - type: tile
            entity: sensor.hawahooligan_rolling_distance_7d
            name: Distance (7d)
            icon: mdi:map-marker-distance
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.hawahooligan_rolling_duration_7d
            name: Saddle time (7d)
            icon: mdi:timer-outline
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.hawahooligan_rolling_workouts_7d
            name: Workouts (7d)
            icon: mdi:run-fast
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.hawahooligan_rolling_tss_28d
            name: Training load (28d)
            icon: mdi:chart-bell-curve
            grid_options:
              columns: 6
              rows: 1
          - type: tile
            entity: sensor.hawahooligan_streak
            name: Streak
            icon: mdi:fire
            color: orange
            grid_options:
              columns: 12
              rows: 1
      - type: grid
        cards:
          - type: heading
            heading: Lifetime totals
            heading_style: title
            icon: mdi:counter
          - type: entities
            entities:
              - entity: sensor.hawahooligan_lifetime_workouts
              - entity: sensor.hawahooligan_lifetime_distance
              - entity: sensor.hawahooligan_lifetime_ascent
              - entity: sensor.hawahooligan_lifetime_duration
              - entity: sensor.hawahooligan_lifetime_calories
              - entity: sensor.hawahooligan_lifetime_work
              - entity: sensor.hawahooligan_lifetime_tss
            state_color: false
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Streak
            heading_style: title
            icon: mdi:fire
          - type: entities
            entities:
              - entity: sensor.hawahooligan_streak
                name: Current streak
              - type: attribute
                entity: sensor.hawahooligan_streak
                attribute: longest_streak
                name: Longest streak
                suffix: " days"
              - type: attribute
                entity: sensor.hawahooligan_streak
                attribute: current_streak_start_date
                name: Streak started
              - type: attribute
                entity: sensor.hawahooligan_streak
                attribute: last_workout_date
                name: Last workout
            state_color: false
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Recent activity
            heading_style: title
            icon: mdi:chart-timeline-variant-shimmer
          - type: entities
            entities:
              - entity: sensor.hawahooligan_rolling_workouts_7d
              - entity: sensor.hawahooligan_rolling_distance_7d
              - entity: sensor.hawahooligan_rolling_duration_7d
              - entity: sensor.hawahooligan_rolling_tss_7d
              - entity: sensor.hawahooligan_rolling_workouts_28d
              - entity: sensor.hawahooligan_rolling_distance_28d
              - entity: sensor.hawahooligan_rolling_duration_28d
              - entity: sensor.hawahooligan_rolling_tss_28d
            state_color: false
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: 28-day distance trend
            heading_style: subtitle
            icon: mdi:chart-line-variant
          - type: history-graph
            hours_to_show: 168
            entities:
              - entity: sensor.hawahooligan_rolling_distance_28d
                name: Distance (28d)
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Outdoor vs indoor
            heading_style: subtitle
            icon: mdi:weather-sunny
          - type: markdown
            content: >
              | | Outdoor | Indoor |

              |---|---|---|

              | {{ state_attr('sensor.hawahooligan_lifetime_workouts', 'friendly_name') or 'Lifetime workouts' }} | {{ state_attr('sensor.hawahooligan_lifetime_workouts','outdoor') or 0 }} | {{ state_attr('sensor.hawahooligan_lifetime_workouts','indoor') or 0 }} |

              | {{ state_attr('sensor.hawahooligan_lifetime_distance', 'friendly_name') or 'Lifetime distance' }} | {{ (state_attr('sensor.hawahooligan_lifetime_distance','outdoor') or 0) | round(1) }} km | {{ (state_attr('sensor.hawahooligan_lifetime_distance','indoor') or 0) | round(1) }} km |

              | {{ state_attr('sensor.hawahooligan_lifetime_ascent', 'friendly_name') or 'Lifetime ascent' }} | {{ (state_attr('sensor.hawahooligan_lifetime_ascent','outdoor') or 0) | round(0) }} m | {{ (state_attr('sensor.hawahooligan_lifetime_ascent','indoor') or 0) | round(0) }} m |

              | {{ state_attr('sensor.hawahooligan_lifetime_duration', 'friendly_name') or 'Lifetime duration' }} | {{ (state_attr('sensor.hawahooligan_lifetime_duration','outdoor') or 0) | round(0) }} min | {{ (state_attr('sensor.hawahooligan_lifetime_duration','indoor') or 0) | round(0) }} min |

              | {{ state_attr('sensor.hawahooligan_lifetime_calories', 'friendly_name') or 'Lifetime calories' }} | {{ (state_attr('sensor.hawahooligan_lifetime_calories','outdoor') or 0) | round(0) }} kcal | {{ (state_attr('sensor.hawahooligan_lifetime_calories','indoor') or 0) | round(0) }} kcal |

              | {{ state_attr('sensor.hawahooligan_lifetime_work', 'friendly_name') or 'Lifetime work' }} | {{ (state_attr('sensor.hawahooligan_lifetime_work','outdoor') or 0) | round(0) }} kJ | {{ (state_attr('sensor.hawahooligan_lifetime_work','indoor') or 0) | round(0) }} kJ |

              | {{ state_attr('sensor.hawahooligan_lifetime_tss', 'friendly_name') or 'Lifetime TSS' }} | {{ (state_attr('sensor.hawahooligan_lifetime_tss','outdoor') or 0) | round(0) }} | {{ (state_attr('sensor.hawahooligan_lifetime_tss','indoor') or 0) | round(0) }} |
            grid_options:
              columns: 12
              rows: auto

  - title: Profile
    path: profile
    icon: mdi:account-heart-outline
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Headline metrics
            heading_style: title
            icon: mdi:flash
          - type: entities
            entities:
              - entity: sensor.hawahooligan_ftp
              - entity: sensor.hawahooligan_critical_power
            state_color: false
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Power zones (Biking)
            heading_style: title
            icon: mdi:chart-bell-curve
          - type: markdown
            content: >
              | Zone | Range |

              |---|---|

              | Z1 (Recovery) | < {{ state_attr('sensor.hawahooligan_ftp', 'zone_1') or '—' }} W |

              | Z2 (Endurance) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_1') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_2') or '—' }} W |

              | Z3 (Tempo) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_2') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_3') or '—' }} W |

              | Z4 (Threshold) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_3') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_4') or '—' }} W |

              | Z5 (VO2max) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_4') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_5') or '—' }} W |

              | Z6 (Anaerobic) | {{ state_attr('sensor.hawahooligan_ftp', 'zone_5') or '—' }} – {{ state_attr('sensor.hawahooligan_ftp', 'zone_6') or '—' }} W |

              | Z7 (Neuromuscular) | > {{ state_attr('sensor.hawahooligan_ftp', 'zone_6') or '—' }} W |
            grid_options:
              columns: 12
              rows: auto
      - type: grid
        cards:
          - type: heading
            heading: Edit zones
            heading_style: subtitle
            icon: mdi:pencil-outline
          - type: entities
            entities:
              - entity: input_number.hawahooligan_target_ftp
                name: Target FTP
            state_color: false
            grid_options:
              columns: 12
              rows: auto
          - type: button
            tap_action:
              action: perform-action
              perform_action: script.hawahooligan_apply_ftp
            name: Apply to Wahoo
            icon: mdi:upload
            show_state: false
            grid_options:
              columns: 12
              rows: 1
