# Example Lovelace view for HAWahooligan.
#
# Pairs the bundled Leaflet viewer (/local/hawahooligan/map.html) with the
# workout sensors, grouped by topic so the long list of measurements doesn't
# overwhelm the map. No HACS frontend cards required — iframe and entities
# cards ship with Home Assistant.
#
# Entity IDs in this file follow what HA actually registers, which is the
# slugified English translation NAME — not the translation_key. So
# ``translation_key: speed_avg`` + ``name: "Average speed"`` becomes
# ``sensor.hawahooligan_average_speed`` (NOT ``..._speed_avg``).
# If your entity registry shows different ids — e.g. because you carried an
# entity over from an earlier version of the integration — adjust the
# entries below or rename the entities in the HA Settings → Entities UI.
#
# Layout note: this view uses the modern `sections` type. In a sections grid
# the iframe card's `aspect_ratio` is ignored (HA frontend treats grid
# placement as authoritative — see hui-iframe-card.ts), so the map needs an
# explicit ``grid_options.rows`` to get height. Each row is ~56px;
# ``rows: 9`` is a comfortable starting point — increase for a bigger map.
views:
  - title: Wahoo
    path: wahoo
    icon: mdi:bike
    type: sections
    max_columns: 2
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Map
            heading_style: title
            icon: mdi:map-marker-path
          - type: iframe
            url: /local/hawahooligan/map.html
            # In sections view aspect_ratio is ignored — size via grid_options.
            grid_options:
              columns: 12
              rows: 9
            # To open a specific workout instead of letting the picker drive,
            # append ?id=<workout_id>:
            # url: /local/hawahooligan/map.html?id=123456

      - type: grid
        cards:
          - type: heading
            heading: Workout
            heading_style: title
            icon: mdi:bike
          - type: entities
            entities:
              - entity: sensor.hawahooligan_last_workout
                name: Start
                secondary_info: last-changed
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: name
                name: Name
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: workout_type
                name: Type
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: indoor
                name: Indoor
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: route_id
                name: Route ID
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: plan_id
                name: Plan ID
              - type: attribute
                entity: sensor.hawahooligan_last_workout
                attribute: selected_workout_id
                name: Selection
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Time & distance
            heading_style: title
            icon: mdi:clock-outline
          - type: entities
            entities:
              - entity: sensor.hawahooligan_duration
              - entity: sensor.hawahooligan_total_duration
              - entity: sensor.hawahooligan_paused_duration
              - entity: sensor.hawahooligan_distance
              - entity: sensor.hawahooligan_ascent
              - entity: sensor.hawahooligan_average_speed
              - entity: sensor.hawahooligan_calories
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Power & body
            heading_style: title
            icon: mdi:flash
          - type: entities
            entities:
              - entity: sensor.hawahooligan_average_power
              - entity: sensor.hawahooligan_normalized_power
              - entity: sensor.hawahooligan_training_stress_score
              - entity: sensor.hawahooligan_work
              - entity: sensor.hawahooligan_average_heart_rate
              - entity: sensor.hawahooligan_average_cadence
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Lifetime
            heading_style: title
            icon: mdi:counter
          # Lifetime sensors carry state_class=total_increasing — drop a
          # utility_meter helper on top of any of them via Settings →
          # Helpers → Utility meter to get monthly / yearly buckets.
          - type: entities
            entities:
              - entity: sensor.hawahooligan_lifetime_workouts
              - entity: sensor.hawahooligan_lifetime_distance
              - entity: sensor.hawahooligan_lifetime_ascent
              - entity: sensor.hawahooligan_lifetime_duration
              - entity: sensor.hawahooligan_lifetime_calories
              - entity: sensor.hawahooligan_lifetime_work
              - entity: sensor.hawahooligan_lifetime_tss
            state_color: false
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Outdoor vs indoor
            heading_style: subtitle
            icon: mdi:weather-sunny
          # Every lifetime sensor carries ``outdoor`` and ``indoor`` sub-sums
          # as attributes. The markdown table below renders them in one
          # compact view; for a single-metric template sensor use
          # state_attr('sensor.hawahooligan_lifetime_distance', 'outdoor').
          # Workouts persisted before 0.7.2 had no location flag and
          # therefore land in neither subset — only the headline totals
          # claim them.
          # Row labels read the entity's friendly name (``states.X.name``)
          # so the table picks up the user's HA locale automatically — a
          # German install sees "Distanz insgesamt" while an English install
          # sees "Lifetime distance".
          - type: markdown
            content: >
              | | Outdoor | Indoor |

              |---|---|---|

              | {{ states.sensor.hawahooligan_lifetime_workouts.name }} | {{ state_attr('sensor.hawahooligan_lifetime_workouts','outdoor') }} | {{ state_attr('sensor.hawahooligan_lifetime_workouts','indoor') }} |

              | {{ states.sensor.hawahooligan_lifetime_distance.name }} | {{ state_attr('sensor.hawahooligan_lifetime_distance','outdoor') | round(1) }} km | {{ state_attr('sensor.hawahooligan_lifetime_distance','indoor') | round(1) }} km |

              | {{ states.sensor.hawahooligan_lifetime_ascent.name }} | {{ state_attr('sensor.hawahooligan_lifetime_ascent','outdoor') | round(0) }} m | {{ state_attr('sensor.hawahooligan_lifetime_ascent','indoor') | round(0) }} m |

              | {{ states.sensor.hawahooligan_lifetime_duration.name }} | {{ state_attr('sensor.hawahooligan_lifetime_duration','outdoor') | round(0) }} min | {{ state_attr('sensor.hawahooligan_lifetime_duration','indoor') | round(0) }} min |

              | {{ states.sensor.hawahooligan_lifetime_calories.name }} | {{ state_attr('sensor.hawahooligan_lifetime_calories','outdoor') | round(0) }} kcal | {{ state_attr('sensor.hawahooligan_lifetime_calories','indoor') | round(0) }} kcal |

              | {{ states.sensor.hawahooligan_lifetime_work.name }} | {{ state_attr('sensor.hawahooligan_lifetime_work','outdoor') | round(0) }} kJ | {{ state_attr('sensor.hawahooligan_lifetime_work','indoor') | round(0) }} kJ |

              | {{ states.sensor.hawahooligan_lifetime_tss.name }} | {{ state_attr('sensor.hawahooligan_lifetime_tss','outdoor') | round(0) }} | {{ state_attr('sensor.hawahooligan_lifetime_tss','indoor') | round(0) }} |
            grid_options:
              columns: 12
              rows: auto

      - type: grid
        cards:
          - type: heading
            heading: Profile
            heading_style: title
            icon: mdi:account-heart-outline
          # Power-zones data refreshes once a day. The 7 zone boundaries
          # ride along as attributes on sensor.hawahooligan_ftp — query
          # them with template sensors (state_attr('sensor.hawahooligan_ftp',
          # 'zone_4')) if you want individual sensors.
          - type: entities
            entities:
              - entity: sensor.hawahooligan_ftp
              - entity: sensor.hawahooligan_critical_power
            state_color: false
            grid_options:
              columns: 12
              rows: auto
