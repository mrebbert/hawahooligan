<!doctype html>
<!--
  HAWahooligan track viewer (provisioned to <config>/www/hawahooligan/map.html).
  Standalone — only depends on Leaflet from a CDN. Embed via a Lovelace
  iframe-card pointed at /local/hawahooligan/map.html.

  Behaviour:
    * Polls /local/hawahooligan/workouts.json (written by the coordinator)
      for the selected workout id and renders its track when one exists.
    * If the selection has no GPS track (indoor, manual, or pre-render),
      shows a friendly overlay instead of a blank map.
    * Selection itself lives in HA — the ``select.hawahooligan_workout_picker``
      entity drives ``coordinator.selected_workout_id``, which lands in
      ``workouts.json`` as ``selected_id``. No in-viewer dropdown — pick
      from the HA dashboard's select card instead.
    * Honours ``?id=<workout_id>`` for direct deep links, overrides the
      manifest selection while present.

  HAWahooligan-Viewer-Version: 4
  Bump that version line in custom_components/hawahooligan/web/map.html when
  you ship breaking changes — the integration re-provisions the file
  whenever the version stamp in <config>/www/hawahooligan/map.html differs
  from the packaged one. Delete the version comment in your local copy to
  pin it against future updates.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HAWahooligan track</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <style>
      html,
      body,
      #map {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: #f5f6f8;
        color: #1f1f1f;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 12px;
        z-index: 1000;
        padding: 6px 10px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        pointer-events: none;
      }
      #status.hidden {
        display: none;
      }
      #status.error {
        background: #fee2e2;
        color: #991b1b;
      }
      #overlay {
        position: absolute;
        inset: 0;
        z-index: 900;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 8px;
        padding: 32px;
        text-align: center;
        background: rgba(245, 246, 248, 0.95);
        color: #4b5563;
        pointer-events: none;
      }
      #overlay.hidden {
        display: none;
      }
      #overlay .glyph {
        font-size: 36px;
      }
      #overlay .headline {
        font-size: 16px;
        font-weight: 600;
        color: #1f1f1f;
      }
      #overlay .sub {
        font-size: 13px;
        max-width: 320px;
      }
    </style>
  </head>
  <body>
    <div id="status">Loading track…</div>
    <div id="overlay" class="hidden">
      <div class="glyph" aria-hidden="true">🏠</div>
      <div class="headline">No GPS track for this workout</div>
      <div class="sub">
        Sensors above stay in sync with your selection — only the map needs an
        outdoor ride with GPS data.
      </div>
    </div>
    <div id="map"></div>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script>
      (() => {
        const map = L.map("map", {
          zoomControl: true,
          attributionControl: true,
        }).setView([51.0, 10.0], 4);

        L.tileLayer(
          "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 19,
            attribution:
              '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
          },
        ).addTo(map);

        const statusEl = document.getElementById("status");
        const overlayEl = document.getElementById("overlay");
        const overlayGlyph = overlayEl.querySelector(".glyph");
        const overlayHeadline = overlayEl.querySelector(".headline");
        const overlaySub = overlayEl.querySelector(".sub");

        const setStatus = (text, isError = false) => {
          if (!text) {
            statusEl.classList.add("hidden");
            return;
          }
          statusEl.classList.remove("hidden");
          statusEl.classList.toggle("error", isError);
          statusEl.textContent = text;
        };

        const showOverlay = (glyph, headline, sub) => {
          overlayGlyph.textContent = glyph;
          overlayHeadline.textContent = headline;
          overlaySub.textContent = sub;
          overlayEl.classList.remove("hidden");
        };

        const hideOverlay = () => {
          overlayEl.classList.add("hidden");
        };

        // ---- track layer state -------------------------------------------------
        let trackLayer = null;
        let markerLayer = null;
        let lastRenderedId = null;

        const clearTrack = () => {
          if (trackLayer) {
            trackLayer.remove();
            trackLayer = null;
          }
          if (markerLayer) {
            markerLayer.remove();
            markerLayer = null;
          }
        };

        const cacheBust = () => `?t=${Date.now()}`;

        const renderTrack = async (url, label) => {
          hideOverlay();
          setStatus(label ? `Loading ${label}…` : "Loading track…");
          let feature;
          try {
            const response = await fetch(`${url}${cacheBust()}`, {
              credentials: "same-origin",
            });
            if (!response.ok) {
              throw new Error(`HTTP ${response.status}`);
            }
            feature = await response.json();
          } catch (err) {
            console.error("HAWahooligan map failed:", err);
            clearTrack();
            setStatus(null);
            showOverlay(
              "🛰️",
              "Couldn't load track",
              `Tried ${url} — got ${err.message}. The track may not be rendered yet.`,
            );
            return;
          }

          clearTrack();

          trackLayer = L.geoJSON(feature, {
            style: { color: "#1e88e5", weight: 4, opacity: 0.9 },
          }).addTo(map);

          markerLayer = L.layerGroup().addTo(map);
          const coords =
            feature && feature.geometry && Array.isArray(feature.geometry.coordinates)
              ? feature.geometry.coordinates
              : [];
          if (coords.length >= 2) {
            const [startLon, startLat] = coords[0];
            const [endLon, endLat] = coords[coords.length - 1];
            L.circleMarker([startLat, startLon], {
              radius: 7,
              color: "#fff",
              weight: 2,
              fillColor: "#22c55e",
              fillOpacity: 1,
            })
              .bindTooltip("Start", { permanent: false })
              .addTo(markerLayer);
            L.circleMarker([endLat, endLon], {
              radius: 7,
              color: "#fff",
              weight: 2,
              fillColor: "#ef4444",
              fillOpacity: 1,
            })
              .bindTooltip("End", { permanent: false })
              .addTo(markerLayer);
          }

          const bounds = trackLayer.getBounds();
          if (bounds.isValid()) {
            map.fitBounds(bounds, { padding: [24, 24] });
          }

          const pointCount =
            feature && feature.properties && feature.properties.point_count;
          setStatus(
            pointCount
              ? `${pointCount.toLocaleString()} GPS points`
              : `${coords.length.toLocaleString()} GPS points`,
          );
          window.setTimeout(() => {
            if (statusEl.textContent.includes("GPS points")) setStatus(null);
          }, 4000);
        };

        const showNoTrackOverlay = (workout) => {
          clearTrack();
          setStatus(null);
          const name = workout && workout.name ? workout.name : "this workout";
          if (workout && workout.indoor) {
            showOverlay(
              "🏠",
              "Indoor workout — no GPS",
              `Sensors above still reflect "${name}". The map only fills when an outdoor ride has GPS data.`,
            );
            return;
          }
          if (workout && workout.manual) {
            showOverlay(
              "📝",
              "Manual entry — no GPS",
              `Sensors above still reflect "${name}". Manual workouts don't include a track.`,
            );
            return;
          }
          showOverlay(
            "🛰️",
            "No GPS track yet",
            `Sensors above reflect "${name}". The track will appear here once it's rendered.`,
          );
        };

        // ---- bootstrap --------------------------------------------------------
        const params = new URLSearchParams(window.location.search);
        const requestedId = params.get("id");
        let urlOverrideId = requestedId ? Number(requestedId) : null;
        if (urlOverrideId !== null && Number.isNaN(urlOverrideId)) {
          urlOverrideId = null;
        }

        const fetchManifest = async () => {
          try {
            const response = await fetch(
              `/local/hawahooligan/workouts.json${cacheBust()}`,
              { credentials: "same-origin" },
            );
            if (!response.ok) return null;
            return await response.json();
          } catch (err) {
            console.warn("HAWahooligan manifest fetch failed:", err);
            return null;
          }
        };

        const findWorkout = (manifest, workoutId) => {
          if (!manifest || !Array.isArray(manifest.workouts)) return null;
          return manifest.workouts.find((w) => w.id === workoutId) || null;
        };

        const resolveTargetId = (manifest) => {
          if (urlOverrideId !== null) return urlOverrideId;
          if (manifest && typeof manifest.selected_id === "number") {
            return manifest.selected_id;
          }
          return null;
        };

        const renderForSelection = async (manifest) => {
          const targetId = resolveTargetId(manifest);
          if (targetId === lastRenderedId && targetId !== null) {
            // Already on this workout — nothing to repaint.
            return;
          }
          lastRenderedId = targetId;
          if (targetId === null) {
            // ``selected_id: null`` means the integration is following the
            // latest workout. ``latest.geojson`` is whatever the most recent
            // outdoor ride was; if the latest is indoor the file is stale,
            // and the failure path falls through to the overlay.
            await renderTrack("/local/hawahooligan/latest.geojson", "latest");
            return;
          }
          const workout = findWorkout(manifest, targetId);
          if (workout && workout.has_track === false) {
            showNoTrackOverlay(workout);
            return;
          }
          await renderTrack(
            `/local/hawahooligan/${encodeURIComponent(targetId)}.geojson`,
            workout && workout.name ? workout.name : `workout ${targetId}`,
          );
        };

        const tick = async () => {
          const manifest = await fetchManifest();
          await renderForSelection(manifest);
        };

        // Poll every 5 s so the viewer follows ``select_workout`` calls from
        // the HA dropdown without needing a websocket subscription. Cheap —
        // the manifest is a few kilobytes and is cached aggressively by the
        // HA HTTP layer for static files.
        tick();
        window.setInterval(tick, 5000);
      })();
    </script>
  </body>
</html>
