render_workout:
  name: Render workout track
  description: >-
    Fetch a Wahoo workout by id and render its FIT file to a GeoJSON track
    under the HA config www/hawahooligan/ directory. Useful for backfilling
    historic rides older than the first-setup window.
  fields:
    workout_id:
      name: Workout ID
      description: Numeric Wahoo workout id (visible in the Wahoo web app URL).
      required: true
      example: "12345678"
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: >-
        Only required when more than one Wahoo account is configured —
        identifies which account's directory to render into.
      required: false
      selector:
        config_entry:
          integration: hawahooligan
    force:
      name: Force re-render
      description: >-
        Re-download the FIT and overwrite the existing GeoJSON even if a
        file for this workout id already exists.
      required: false
      default: false
      selector:
        boolean:

select_workout:
  name: Select workout
  description: >-
    Pin the headline sensors and the map viewer to a specific workout id so
    the entire dashboard follows the chosen ride. Pass workout_id "latest"
    (or leave it empty) to release the pin and track the newest workout
    again.
  fields:
    workout_id:
      name: Workout ID
      description: >-
        Numeric Wahoo workout id, or the literal "latest" to follow the
        newest workout.
      required: false
      example: "12345678"
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: >-
        Only required when more than one Wahoo account is configured.
      required: false
      selector:
        config_entry:
          integration: hawahooligan

full_backfill:
  name: Full-history backfill
  description: >-
    Paginate through the user's entire Wahoo history (not just the last 20)
    and feed the lifetime totals. Rate-limit aware — defaults stay under the
    Sandbox tier's 25 calls per 5-min ceiling. Fires the
    hawahooligan_full_backfill_progress event after each page so an
    automation can show a notification.
  fields:
    with_tracks:
      name: Also render tracks
      description: >-
        Also download and render the FIT file for each outdoor workout. Adds
        a FIT download per workout (doesn't count against the rate limit) and
        a GeoJSON file under www/hawahooligan/. Disk usage can grow quickly.
      required: false
      default: false
      selector:
        boolean:
    max_pages:
      name: Max pages
      description: >-
        Safety guard — stop after this many pages even if the API keeps
        returning data. 200 pages × 50 workouts/page = 10 000 workouts upper
        bound.
      required: false
      default: 200
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    max_calls_per_window:
      name: Max calls per window
      description: >-
        Rate-limit budget for the rolling window. Sandbox has THREE caps —
        25 / 5-min AND 100 / hour AND 250 / day; default 8 keeps you under
        the hourly cap (≈ 96 calls/hour) with headroom for the regular
        15-min poll. Production tier (200 / 5-min, 1000 / hour, 5000 / day)
        can bump this to ~50 to run much faster.
      required: false
      default: 8
      selector:
        number:
          min: 1
          max: 200
          mode: box
    window_seconds:
      name: Window seconds
      description: Rolling-window length in seconds. Wahoo's window is 300 s.
      required: false
      default: 300
      selector:
        number:
          min: 10
          max: 3600
          mode: box
    config_entry_id:
      name: Config entry
      description: Only required when more than one Wahoo account is configured.
      required: false
      selector:
        config_entry:
          integration: hawahooligan

cleanup_geojson:
  name: Cleanup cached tracks
  description: >-
    Prune GeoJSON track files in the HA config www/hawahooligan/ directory
    that are older than ``max_age_days`` days. The cache grows unbounded
    with backfills + render_workout calls; wire this to a nightly
    automation to keep disk usage in check.
  fields:
    max_age_days:
      name: Max age (days)
      description: >-
        Files whose modification time is older than this threshold get
        removed. Default 180 covers two seasons of riding.
      required: false
      default: 180
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    config_entry_id:
      name: Config entry
      description: Only required when more than one Wahoo account is configured.
      required: false
      selector:
        config_entry:
          integration: hawahooligan

refresh_power_zones:
  name: Refresh FTP / power zones
  description: >-
    Force an immediate refresh of the FTP, Critical Power, and zone
    threshold sensors instead of waiting for the regular 24-hour cycle.
    Useful after updating FTP in the Wahoo app or after a Reauth that
    grants the ``power_zones_read`` scope for the first time.
    Fire-and-forget: the call returns immediately, the refresh runs in
    the background and updates the sensors when Wahoo responds.
  fields:
    config_entry_id:
      name: Config entry
      description: Only required when more than one Wahoo account is configured.
      required: false
      selector:
        config_entry:
          integration: hawahooligan

set_power_zones:
  name: Set FTP / power zones
  description: >-
    Set or update your FTP, critical power, and the seven zone
    boundaries via the Wahoo Cloud API — no Postman detour. Auto-derives
    zone_1..zone_7 from FTP using the Coggan defaults; pass any zone_N
    explicitly to override. Creates a new record on first call, updates
    the existing one on subsequent calls. The FTP / Critical Power
    sensors refresh immediately after the write so the dashboard
    reflects the new value without waiting for the daily poll.
  fields:
    ftp:
      name: FTP
      description: Functional Threshold Power in watts (1-hour effort).
      required: true
      selector:
        number:
          min: 50
          max: 600
          step: 1
          unit_of_measurement: W
          mode: box
    critical_power:
      name: Critical Power
      description: >-
        Sustainable steady-state power in watts. Defaults to FTP if
        omitted. Wahoo's apps treat this and FTP as related metrics —
        most users keep them the same.
      required: false
      selector:
        number:
          min: 50
          max: 600
          step: 1
          unit_of_measurement: W
          mode: box
    zone_1:
      name: Zone 1 upper boundary
      description: Optional override — defaults to 55% of FTP (Coggan).
      required: false
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: W
          mode: box
    zone_2:
      name: Zone 2 upper boundary
      description: Optional override — defaults to 75% of FTP.
      required: false
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: W
          mode: box
    zone_3:
      name: Zone 3 upper boundary
      description: Optional override — defaults to 90% of FTP.
      required: false
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: W
          mode: box
    zone_4:
      name: Zone 4 upper boundary
      description: Optional override — defaults to 105% of FTP.
      required: false
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: W
          mode: box
    zone_5:
      name: Zone 5 upper boundary
      description: Optional override — defaults to 120% of FTP.
      required: false
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: W
          mode: box
    zone_6:
      name: Zone 6 upper boundary
      description: Optional override — defaults to 150% of FTP.
      required: false
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: W
          mode: box
    zone_7:
      name: Zone 7 upper boundary
      description: >-
        Optional override — defaults to 195% of FTP (a "sprint ceiling"
        sentinel; Z7 has no real upper bound).
      required: false
      selector:
        number:
          min: 0
          max: 2000
          step: 1
          unit_of_measurement: W
          mode: box
    workout_type_id:
      name: Workout type
      description: >-
        Which Wahoo workout type this profile applies to. 0 = Biking
        (default), 2 = Indoor Cycling, etc.
      required: false
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
    config_entry_id:
      name: Config entry
      description: Only required when more than one Wahoo account is configured.
      required: false
      selector:
        config_entry:
          integration: hawahooligan
