render_workout:
  name: Render workout track
  description: >-
    Fetch a Wahoo workout by id and render its FIT file to a GeoJSON track
    under the HA config www/hawahooligan/ directory. Useful for backfilling
    historic rides older than the first-setup window.
  fields:
    workout_id:
      name: Workout ID
      description: Numeric Wahoo workout id (visible in the Wahoo web app URL).
      required: true
      example: "12345678"
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: >-
        Only required when more than one Wahoo account is configured —
        identifies which account's directory to render into.
      required: false
      selector:
        config_entry:
          integration: hawahooligan
    force:
      name: Force re-render
      description: >-
        Re-download the FIT and overwrite the existing GeoJSON even if a
        file for this workout id already exists.
      required: false
      default: false
      selector:
        boolean:

select_workout:
  name: Select workout
  description: >-
    Pin the headline sensors and the map viewer to a specific workout id so
    the entire dashboard follows the chosen ride. Pass workout_id "latest"
    (or leave it empty) to release the pin and track the newest workout
    again.
  fields:
    workout_id:
      name: Workout ID
      description: >-
        Numeric Wahoo workout id, or the literal "latest" to follow the
        newest workout.
      required: false
      example: "12345678"
      selector:
        text:
    config_entry_id:
      name: Config entry
      description: >-
        Only required when more than one Wahoo account is configured.
      required: false
      selector:
        config_entry:
          integration: hawahooligan

full_backfill:
  name: Full-history backfill
  description: >-
    Paginate through the user's entire Wahoo history (not just the last 20)
    and feed the lifetime totals. Rate-limit aware — defaults stay under the
    Sandbox tier's 25 calls per 5-min ceiling. Fires the
    hawahooligan_full_backfill_progress event after each page so an
    automation can show a notification.
  fields:
    with_tracks:
      name: Also render tracks
      description: >-
        Also download and render the FIT file for each outdoor workout. Adds
        a FIT download per workout (doesn't count against the rate limit) and
        a GeoJSON file under www/hawahooligan/. Disk usage can grow quickly.
      required: false
      default: false
      selector:
        boolean:
    max_pages:
      name: Max pages
      description: >-
        Safety guard — stop after this many pages even if the API keeps
        returning data. 200 pages × 50 workouts/page = 10 000 workouts upper
        bound.
      required: false
      default: 200
      selector:
        number:
          min: 1
          max: 1000
          mode: box
    max_calls_per_window:
      name: Max calls per window
      description: >-
        Rate-limit budget. Sandbox = 25 / 5-min; the default 20 leaves room
        for the regular 15-min poll to slip through. Production tier (200 /
        5-min) can run much faster.
      required: false
      default: 20
      selector:
        number:
          min: 1
          max: 200
          mode: box
    window_seconds:
      name: Window seconds
      description: Rolling-window length in seconds. Wahoo's window is 300 s.
      required: false
      default: 300
      selector:
        number:
          min: 10
          max: 3600
          mode: box
    config_entry_id:
      name: Config entry
      description: Only required when more than one Wahoo account is configured.
      required: false
      selector:
        config_entry:
          integration: hawahooligan

cleanup_geojson:
  name: Cleanup cached tracks
  description: >-
    Prune GeoJSON track files in the HA config www/hawahooligan/ directory
    that are older than ``max_age_days`` days. The cache grows unbounded
    with backfills + render_workout calls; wire this to a nightly
    automation to keep disk usage in check.
  fields:
    max_age_days:
      name: Max age (days)
      description: >-
        Files whose modification time is older than this threshold get
        removed. Default 180 covers two seasons of riding.
      required: false
      default: 180
      selector:
        number:
          min: 1
          max: 3650
          mode: box
    config_entry_id:
      name: Config entry
      description: Only required when more than one Wahoo account is configured.
      required: false
      selector:
        config_entry:
          integration: hawahooligan
