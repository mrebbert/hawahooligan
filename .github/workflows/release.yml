name: Release

on:
  release:
    types: [published]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    name: Package and attach release archive
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create release archive
        # HACS extracts release ZIPs straight into ``custom_components/<domain>/``,
        # so the archive must contain the integration FILES at its root, NOT a
        # wrapper directory. Putting ``hawahooligan/`` at the top of the zip
        # would land the install at ``custom_components/hawahooligan/hawahooligan/``
        # — HA then reports "Integration 'hawahooligan' not found". Burned in
        # v0.7.23, fixed in v0.7.24.
        run: |
          cd custom_components/hawahooligan
          zip -r ../../hawahooligan.zip .

      - name: Upload release asset
        uses: softprops/action-gh-release@v3
        with:
          files: hawahooligan.zip
