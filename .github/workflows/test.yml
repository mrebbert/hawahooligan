name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

# Opt every JavaScript action (including transitive ``actions/cache@v4``
# pulled in by setup-python / pre-commit) onto Node.js 24. Node 20 is
# deprecated on Sept 16 2026; this defuses the warning before it
# becomes a hard failure. Safe override — the runtime contract for
# Node actions is the same across 20 → 24.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: Unit tests (helpers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: pip install -e ".[test]"

      - name: Run pytest
        run: pytest tests -v --ignore=tests/integration --cov=custom_components/hawahooligan --cov-report=term-missing

  integration-tests:
    name: Integration tests (HA stack)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install integration test dependencies
        run: pip install -e ".[test-integration]"

      - name: Run integration pytest
        run: pytest tests/integration -v

  lint:
    name: Lint (ruff via pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
